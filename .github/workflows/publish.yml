name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.changed != 'false' && steps.published.outputs.exists != 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Detect version change
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./package.json').version")
          previous=$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
          if [ -n "$previous" ] && [ "$previous" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is unchanged ($current); skipping publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check published version
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already published; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up npm trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
